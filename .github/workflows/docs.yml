# Publishes the AnkiTov documentation site (mdBook) to GitHub Pages.
#
# This is the public docs repo — the slim counterpart of the private
# monorepo's docs workflow (which also builds rustdoc and runs the docs
# timeliness audit). Site: https://yitzhakbg.github.io/ankitov-docs/
#
# mdBook version is pinned to the version used locally (see docs/book.toml).

name: Documentation

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          MDBOOK_VERSION=0.5.4
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin mdbook
          mdbook --version

      - name: Build mdBook
        run: mdbook build docs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -a docs/book/. _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
